name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            filament: '^4.0'
          - php: '8.4'
            filament: '5.9.0'
          - php: '8.4'
            filament: '5.10.1'
          - php: '8.4'
            filament: '^5.0'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, mbstring, zip, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none

      - name: Select Filament version
        run: composer require --no-interaction --no-update "filament/filament:${{ matrix.filament }}"

      - name: Install dependencies
        run: composer update --with-all-dependencies --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --ci
