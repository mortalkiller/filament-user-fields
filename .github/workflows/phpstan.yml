name: PHPStan

on:
  push:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
      - '.github/workflows/phpstan.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.php'
      - 'composer.json'
      - '.github/workflows/phpstan.yml'

jobs:
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: dom, curl, mbstring, zip, pdo_sqlite, sqlite3, bcmath, intl, gd
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@26d8a556604053a9612623447203a691f406fbe6 # v4

      - name: Run PHPStan
        run: ./vendor/bin/phpstan analyse src --level=0 --no-progress --error-format=github
